version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "0011"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payments"]
      interval: 5s
      timeout: 5s
      retries: 5

  service-db-saver:
    build: ./service-db-saver
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=jdbc:postgresql://postgres:5432/payments
    ports:
      - "8080:8080" 

  service-event-maker:
    build: ./service-event-maker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=jdbc:postgresql://postgres:5432/payments

  payment-producer:
    build: ./payment-producer
    depends_on:
      - service-db-saver
    environment:
      - DB_HOST=postgres
      - SAVER_URL=http://service-db-saver:8080

volumes:
  postgres_data: